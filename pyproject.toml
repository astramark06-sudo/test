[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-operations-platform"
version = "0.1.0"
description = "Zero-budget modular AI operations platform, starting with auditable document OCR."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
data = ["pandas>=2.2", "openpyxl>=3.1"]
ocr = ["paddleocr>=2.8", "paddlepaddle>=2.6", "opencv-python-headless>=4.9"]

[project.scripts]
aiops = "aiops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
